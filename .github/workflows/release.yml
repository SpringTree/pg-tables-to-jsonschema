name: Release

on:
  push:
    branches: [master]

# Repository writes (release PR, tag, GitHub release) use the GitHub App token,
# so the default token only needs to read
permissions:
  contents: read

# Third-party actions are pinned by commit SHA (release tag in the comment), see ci.yml

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows,
      # so required checks would never run on the release PR
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Opens or updates the release PR; when that PR is merged it creates the tag
      # and GitHub release and sets release_created
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher; only `master` may deploy to it
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    env:
      HUSKY: "0" # no git hooks needed in CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - run: bun run fmt
      - run: bun run test
      - run: bun run build

      # Authenticates with OIDC through the trusted publisher configured on npmjs.com, no token needed.
      # Provenance is generated automatically by trusted publishing
      - run: npm publish --access public
